<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPad 10th Gen FTC MagSafe Case — 3D CAD Viewer</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(22, 26, 34, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-active: #0284c7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container { position: fixed; inset: 0; touch-action: none; }
    .hud-top {
      position: fixed; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; pointer-events: none; z-index: 10;
    }
    .card {
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; pointer-events: auto;
    }
    .back-link {
      display: inline-block; color: var(--accent); text-decoration: none;
      font-size: 13px; font-weight: 600; margin-bottom: 4px;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.25; }
    .specs { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .hud-bottom {
      position: fixed; bottom: 14px; left: 12px; right: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none; z-index: 10;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 14px; padding: 8px;
      pointer-events: auto; max-width: 100%;
    }
    button {
      appearance: none; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06);
      color: var(--text); font-size: 12px; font-weight: 600; padding: 7px 11px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(255, 255, 255, 0.14); }
    button.active { background: var(--accent-active); border-color: var(--accent); color: #ffffff; }
    .swatch-group { display: flex; align-items: center; gap: 6px; padding-left: 4px; }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }
    .swatch.active { border-color: #ffffff; transform: scale(1.12); }
    #status-overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(15, 17, 21, 0.9); z-index: 20; padding: 20px; text-align: center;
    }
    .status-box {
      max-width: 380px; background: #181c24; border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
    }
    .spinner {
      width: 30px; height: 30px; border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-top">
    <div class="card">
      <a class="back-link" href="./index.html">&larr; All 3D Viewers</a>
      <h1>iPad 10th Gen FTC MagSafe Case</h1>
      <div class="specs" id="dimensions-text">Loading mesh dimensions...</div>
    </div>
  </div>
  <div class="hud-bottom">
    <div class="toolbar">
      <button id="view-iso" class="active" data-view="iso">3D Iso</button>
      <button id="view-back" data-view="back">Back (FTC)</button>
      <button id="view-inside" data-view="inside">Inside (Magnets)</button>
      <button id="view-side" data-view="side">Side</button>
    </div>
    <div class="toolbar">
      <button id="mode-solid" class="active" data-mode="solid">Solid</button>
      <button id="mode-xray" data-mode="xray">X-Ray</button>
      <button id="mode-wire" data-mode="wire">Wireframe</button>
      <div class="swatch-group" aria-label="Filament color">
        <button class="swatch active" style="background:#3b4252;" data-color="#3b4252" title="Matte Charcoal"></button>
        <button class="swatch" style="background:#94a3b8;" data-color="#94a3b8" title="PLA+ Silver"></button>
        <button class="swatch" style="background:#6d28d9;" data-color="#6d28d9" title="Cobalt Violet"></button>
        <button class="swatch" style="background:#0284c7;" data-color="#0284c7" title="Cyan Blue"></button>
      </div>
    </div>
  </div>
  <div id="status-overlay">
    <div class="status-box">
      <div class="spinner" id="spinner"></div>
      <div id="status-message">Loading iPad_10th_Gen_FTC_MagSafe_Case.stl...</div>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const STL_FILE = './iPad_10th_Gen_FTC_MagSafe_Case.stl';
    const container = document.getElementById('canvas-container');
    const statusOverlay = document.getElementById('status-overlay');
    const statusMessage = document.getElementById('status-message');
    const spinner = document.getElementById('spinner');
    const dimensionsText = document.getElementById('dimensions-text');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 2500);
    camera.position.set(180, -160, 220);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 40;
    controls.maxDistance = 900;

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
    keyLight.position.set(160, -180, 260);
    scene.add(keyLight);
    const backLight = new THREE.DirectionalLight(0xdbeafe, 1.15);
    backLight.position.set(-160, 180, -240);
    scene.add(backLight);
    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.45);
    rimLight.position.set(0, 260, 80);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(320, 16, 0x334155, 0x1e293b);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    let modelRadius = 160;
    const material = new THREE.MeshStandardMaterial({
      color: 0x3b4252, roughness: 0.48, metalness: 0.08, side: THREE.DoubleSide
    });

    new STLLoader().load(
      STL_FILE,
      (geometry) => {
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        const box = geometry.boundingBox;
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        geometry.translate(-center.x, -center.y, -center.z);
        grid.position.z = -size.z / 2 - 1;
        scene.add(new THREE.Mesh(geometry, material));
        modelRadius = Math.max(size.x, size.y) * 0.72;
        dimensionsText.textContent =
          `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm • 3× FTC • 18× 6×3mm MagSafe`;
        setCameraView('iso');
        statusOverlay.classList.add('hidden');
      },
      (xhr) => {
        if (xhr.total > 0) {
          statusMessage.textContent = `Loading model... ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
        }
      },
      () => {
        spinner.classList.add('hidden');
        statusMessage.innerHTML = `Could not load <strong>${STL_FILE}</strong>.`;
      }
    );

    function setCameraView(view) {
      const d = modelRadius * 1.95;
      controls.target.set(0, 0, 0);
      if (view === 'iso') camera.position.set(d * 0.55, -d * 0.48, d * 0.72);
      else if (view === 'back') camera.position.set(0, 0, -d);
      else if (view === 'inside') camera.position.set(0, 0, d);
      else if (view === 'side') camera.position.set(d, 0, 0);
      controls.update();
    }

    function setRenderMode(mode) {
      material.wireframe = mode === 'wire';
      material.transparent = mode === 'xray';
      material.opacity = mode === 'xray' ? 0.34 : 1.0;
      material.depthWrite = mode !== 'xray';
      material.needsUpdate = true;
    }

    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-view]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        setCameraView(btn.dataset.view);
      });
    });
    document.querySelectorAll('[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        setRenderMode(btn.dataset.mode);
      });
    });
    document.querySelectorAll('[data-color]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-color]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        material.color.set(btn.dataset.color);
      });
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
